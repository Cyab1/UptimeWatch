services:
  - type: web
    name: uptimewatch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: hello@stackwiseza.co.za
      - key: SMTP_PASS
        value: your_zoho_password_here